[tools]
aws-cli = { version = "latest", symlink_bins = "true" }
bun = "latest"
codex = "latest"
deno = "latest"
docker-compose = "latest"
fd = "latest"
firebase = "latest"
fzf = "latest"
gcloud = "latest"
gemini-cli = { version = "latest", allow_builds = ["@github/keytar", "node-pty"] }
glow = "latest"
go = "1.24.5"
golangci-lint = "latest"
helix = "latest"
herdr = "latest"
hunk = "latest"
jq = "latest"
lazygit = "latest"
lua = "5.4.7"
luajit = "2.1.1744318430"
marp-cli = "latest"
mysql = "8.0.33"
neovim = "stable"
node = "26.5.0"
php = "latest"
pnpm = "12.8.1"
python = "3.14.4"
resvg = "latest"
ripgrep = "latest"
sheldon = "latest"
starship = "latest"
terraform = "latest"
tree-sitter = "latest"
yarn = "4.9.2"
yazi = "latest"
zoxide = "latest"

[settings]
idiomatic_version_file_enable_tools = ["python"]

[dotfiles]
"~/.bashrc" = { source = "~/dotfiles/bash/.bashrc" }
"~/.gitconfig" = { source = "~/dotfiles/git/.gitconfig" }
"~/.gitconfig_global" = { source = "~/dotfiles/git/.gitconfig_global" }
"~/.gitignore_global" = { source = "~/dotfiles/git/.gitignore_global" }
"~/.zprofile" = { source = "~/dotfiles/zsh/.zprofile" }
"~/.zshenv" = { source = "~/dotfiles/zsh/.zshenv" }
"~/.zshrc" = { source = "~/dotfiles/zsh/.zshrc" }
"~/Brewfile" = { source = "~/dotfiles/shell/Brewfile" }
